name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Сравнивает diff с базой PR / предыдущим коммитом; выходы — строки 'true' или ''
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mlservice: ${{ steps.filter.outputs.mlservice }}
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mlservice:
              - 'MLService/**'
              - '.pre-commit-config.yaml'
            backend:
              - 'Backend/**'
            ios:
              - 'iOSApp/**'
            workflows:
              - '.github/workflows/**'

  mlservice-lint:
    name: MLService (ruff)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MLService
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip MLService lint (paths unchanged)
        if: ${{ needs.changes.outputs.mlservice != 'true' && needs.changes.outputs.workflows != 'true' && github.event_name != 'workflow_dispatch' }}
        run: echo "No MLService/** or workflow changes — skipping ruff."

      - name: Setup Python
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MLService/requirements-dev.txt
            MLService/requirements.txt

      - name: Install ruff
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: >
          ruff check
          tests
          services
          app.py
          training/losses
          training/datasets
          training/sagittal_binary_cv.py
          training/tmj_position_label_table.py
          training/roi_provenance.py
          training/utils/binary_metrics.py
          training/utils/seed.py
          training/utils/datasphere_env.py
          models/tmj_binary_position_classifier.py
          models/blocks.py
          tools/check_training_inputs.py
          tools/auto_crop_from_detector.py
          tools/run_research.py
          tools/datasphere_research.py
          tools/infer_research.py

      - name: Ruff format (check only)
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: >
          ruff format --check
          tests
          services
          app.py
          training/losses
          training/datasets
          training/sagittal_binary_cv.py
          training/tmj_position_label_table.py
          training/roi_provenance.py
          training/utils/binary_metrics.py
          training/utils/seed.py
          training/utils/datasphere_env.py
          models/tmj_binary_position_classifier.py
          models/blocks.py
          tools/check_training_inputs.py
          tools/auto_crop_from_detector.py
          tools/run_research.py
          tools/datasphere_research.py
          tools/infer_research.py

  mlservice-tests:
    name: MLService (Python ${{ matrix.python-version }}, pytest)
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: MLService
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip MLService (paths unchanged)
        if: ${{ needs.changes.outputs.mlservice != 'true' && needs.changes.outputs.workflows != 'true' && github.event_name != 'workflow_dispatch' }}
        run: echo "No MLService/** or workflow changes — skipping install and tests."

      - name: Setup Python ${{ matrix.python-version }}
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            MLService/requirements.txt
            MLService/tools/research_cloud_requirements.txt

      - name: Install dependencies
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --upgrade pip
          # Keep this matrix CPU-only; broad requirements reuse these versions.
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Run tests
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: python -m pytest tests/ -v --tb=short

  mlservice-research-smoke:
    name: MLService (Python 3.12, pinned research CPU smoke)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: MLService
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MLService/tools/research_cloud_requirements.txt
      - name: Install isolated research CPU closure
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/research_cloud_requirements.txt pytest==9.1.1
      - name: Synthetic readiness smoke (no cloud transport)
        run: >
          python -m pytest -p no:cacheprovider
          tests/test_canonical_training_inputs.py
          tests/test_roi_provenance.py
          tests/test_run_research.py
          tests/test_sagittal_binary_cv.py
          tests/test_cv_artifacts.py
          tests/test_multiclass_research.py
          tests/test_infer_research.py
          tests/test_research_architecture.py
          tests/test_datasphere_research.py
          -q --tb=short

  backend-build:
    name: Backend (Swift build)
    needs: changes
    runs-on: macos-14
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip Backend (paths unchanged)
        if: ${{ needs.changes.outputs.backend != 'true' && needs.changes.outputs.workflows != 'true' && github.event_name != 'workflow_dispatch' }}
        run: echo "No Backend/** or workflow changes — skipping Swift build."

      - name: Setup Swift
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Cache SwiftPM
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@v5
        with:
          path: Backend/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Backend/Package.swift', 'Backend/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: swift build -v
