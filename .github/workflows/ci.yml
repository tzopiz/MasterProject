name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Сравнивает diff с базой PR / предыдущим коммитом; выходы — строки 'true' или ''
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mlservice: ${{ steps.filter.outputs.mlservice }}
      backend: ${{ steps.filter.outputs.backend }}
      ios: ${{ steps.filter.outputs.ios }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Paths filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mlservice:
              - 'MLService/**'
              - '.pre-commit-config.yaml'
            backend:
              - 'Backend/**'
            ios:
              - 'iOSApp/**'
            workflows:
              - '.github/workflows/**'

  mlservice-lint:
    name: MLService (ruff)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MLService
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip MLService lint (paths unchanged)
        if: ${{ needs.changes.outputs.mlservice != 'true' && needs.changes.outputs.workflows != 'true' && github.event_name != 'workflow_dispatch' }}
        run: echo "No MLService/** or workflow changes — skipping ruff."

      - name: Setup Python
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            MLService/requirements-dev.txt
            MLService/requirements.txt

      - name: Install ruff
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: >
          ruff check
          tests
          services
          app.py
          training/losses
          training/datasets

      - name: Ruff format (check only)
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: >
          ruff format --check
          tests
          services
          app.py
          training/losses
          training/datasets

  mlservice-tests:
    name: MLService (Python ${{ matrix.python-version }}, pytest)
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: MLService
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip MLService (paths unchanged)
        if: ${{ needs.changes.outputs.mlservice != 'true' && needs.changes.outputs.workflows != 'true' && github.event_name != 'workflow_dispatch' }}
        run: echo "No MLService/** or workflow changes — skipping install and tests."

      - name: Setup Python ${{ matrix.python-version }}
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: MLService/requirements.txt

      - name: Install dependencies
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        if: ${{ needs.changes.outputs.mlservice == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: python -m pytest tests/ -v --tb=short

  backend-build:
    name: Backend (Swift build)
    needs: changes
    runs-on: macos-14
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Skip Backend (paths unchanged)
        if: ${{ needs.changes.outputs.backend != 'true' && needs.changes.outputs.workflows != 'true' && github.event_name != 'workflow_dispatch' }}
        run: echo "No Backend/** or workflow changes — skipping Swift build."

      - name: Setup Swift
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Cache SwiftPM
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@v5
        with:
          path: Backend/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('Backend/Package.swift', 'Backend/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
        run: swift build -v
